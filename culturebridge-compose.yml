services:
  culturebridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: culturebridge
    container_name: culturebridge
    restart: unless-stopped
    depends_on:
      - culturebridge_database
    env_file:
      - .env
    networks:
      - culturebridge
    volumes:
      - .:/app:rw
      - .env:/app/.env:rw

    ports:
      - 8001:8001
  
  culturebridge_database:
    image: postgres
    container_name: culturebridge_database
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - culturebridge
    volumes:
      - culturebrdige_data:/var/lib/postgresql
    ports:
      - 5434:5432

  culturebridge_celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: culturebridge_celery
    container_name: culturebridge_celery
    restart: unless-stopped
    depends_on:
      - culturebridge_database
      - culturebridge_redis
      - culturebridge
    command: celery -A culturebridge.celery worker --loglevel=info -E
    env_file:
      - .env
    networks:
      - culturebridge
    volumes:
      - .:/app
      - .env:/app/.env


  culturebridge_celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: culturebridge_celery_beat
    container_name: culturebridge_celery_beat
    restart: unless-stopped
    depends_on:
      - culturebridge_database
      - culturebridge_redis
      - culturebridge
      - culturebridge_celery
    command: celery -A culturebridge.celery beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    networks:
      - culturebridge
    volumes:
      - .:/app
      - .env:/app/.env

  culturebridge_redis:
    image: redis:alpine
    container_name: culturebridge_redis
    restart: unless-stopped
    networks:
      - culturebridge
    ports:
      - 6380:6379
    env_file:
      - .env

networks:
  culturebridge:

volumes:
  culturebrdige_data: